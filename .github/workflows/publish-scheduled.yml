name: Publish scheduled posts

# Scheduled posts are committed immediately but filtered out of the build until
# their publishAt passes. Nothing rebuilds the site on its own, so this checks
# hourly and triggers a deploy when a post has just come due.
on:
  schedule:
    - cron: "5 * * * *" # hourly, a few minutes past the hour
  workflow_dispatch: # manual "publish anything due now" button

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for posts that just went live
        id: check
        run: node scripts/due-posts.mjs >> "$GITHUB_OUTPUT"
        env:
          # Slightly wider than the hourly cadence so a late run can't skip a post.
          WINDOW_MINUTES: 70

      - name: Trigger Cloudflare deploy
        if: steps.check.outputs.due == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK secret is not set — a post is due but the site cannot be rebuilt."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
          echo "Triggered a rebuild for the posts listed above."
